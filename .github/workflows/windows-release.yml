name: Windows OBS packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.family }} / Windows x64
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs-version: '32.2.2'
            family: OBS32
          - obs-version: '33.0.1'
            family: OBS33

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install NSIS for CPack
        shell: pwsh
        run: choco install nsis.install --version=3.12.0 --yes --no-progress

      - name: Build and package OBS plugin
        shell: pwsh
        run: ./scripts/Build-Windows-Obs.ps1 -ObsVersion '${{ matrix.obs-version }}'

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: countdownstudio-${{ matrix.family }}-windows-x64
          path: build-obs-${{ matrix.obs-version }}/packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6

          cat > release-notes.md <<'EOF'
          ## English

          Windows x64 installers and ZIP packages, built against OBS Studio 32.2.2 (legacy layout) and OBS Studio 33.0.1 (modern layout). SHA-256 checksums are included. The NSIS installer is unsigned.

          ## Français

          Installateurs Windows x64 et paquets ZIP compilés pour OBS Studio 32.2.2 (format historique) et OBS Studio 33.0.1 (nouveau format). Les sommes de contrôle SHA-256 sont incluses. L’installateur NSIS n’est pas signé.
          EOF

          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Countdown Studio ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
