name: OBS Studio packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.family }} / Windows x64
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs-version: '32.2.2'
            family: OBS32
          - obs-version: '33.0.1'
            family: OBS33

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install NSIS for CPack
        shell: pwsh
        run: |
          $attempt = 1
          while ($attempt -le 3) {
            choco install nsis.install --version=3.12.0 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 15) }
            $attempt++
          }
          exit 1

      - name: Build and package OBS plugin
        shell: pwsh
        run: ./scripts/Build-Windows-Obs.ps1 -ObsVersion '${{ matrix.obs-version }}'

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: countdownstudio-${{ matrix.family }}-windows-x64
          path: |
            build-obs-${{ matrix.obs-version }}/packages/*.exe
            build-obs-${{ matrix.obs-version }}/packages/*.zip
            build-obs-${{ matrix.obs-version }}/packages/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: ${{ matrix.family }} / Linux x64
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: OBS32
            obs-version: '32.2.2'
            obs-source-sha256: 'ec81fb66b03e75ddb3076b576f62679c39262e0e9960cef3e17a40dc5d68e6b4'
            runner: ubuntu-24.04
            layout: legacy
          - family: OBS33
            obs-version: '33.0.1'
            obs-source-sha256: 'c8d3a8f69a0f17970ac0a8f2a2462f1bc4dacd324f6da0c4b408d442d4798913'
            runner: ubuntu-26.04
            layout: modern

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install OBS SDK build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake extra-cmake-modules ninja-build pkg-config curl git swig python3-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libx264-dev libcurl4-openssl-dev libmbedtls-dev \
            libgl1-mesa-dev libjansson-dev libluajit-5.1-dev libx11-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev libxcomposite-dev \
            libxinerama-dev libxcb1-dev libx11-xcb-dev libxcb-xfixes0-dev libxss-dev \
            libglvnd-dev libgles2-mesa-dev libwayland-dev librist-dev libsrt-openssl-dev \
            libpci-dev libpipewire-0.3-dev libqrcodegencpp-dev libsimde-dev uthash-dev libpulse-dev libxcb-xinput-dev \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev qt6-wayland qt6-image-formats-plugins

      - name: Build matching OBS SDK
        shell: bash
        run: |
          set -euo pipefail
          version='${{ matrix.obs-version }}'
          source_archive="$RUNNER_TEMP/OBS-Studio-$version-Sources.tar.gz"
          source_url="https://github.com/obsproject/obs-studio/releases/download/$version/OBS-Studio-$version-Sources.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "$source_url" --output "$source_archive"
          echo '${{ matrix.obs-source-sha256 }}  '"$source_archive" | sha256sum --check --strict

          source_workspace="$RUNNER_TEMP/obs-source-$version"
          source_root="$source_workspace/obs-studio-$version-sources"
          sdk_build="$RUNNER_TEMP/obs-sdk-build-$version"
          sdk_prefix="$RUNNER_TEMP/obs-sdk-install-$version"
          mkdir -p "$source_workspace"
          tar -xzf "$source_archive" -C "$source_workspace"
          test -f "$source_root/CMakeLists.txt"

          cmake -S "$source_root" -B "$sdk_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBS_CMAKE_VERSION:STRING=3.0.0 \
            -DOBS_VERSION_OVERRIDE:STRING="$version" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR:BOOL=OFF \
            -DENABLE_PLUGINS:BOOL=OFF \
            -DENABLE_FRONTEND:BOOL=OFF \
            -DENABLE_SCRIPTING:BOOL=OFF \
            -DENABLE_BROWSER:BOOL=OFF \
            -DENABLE_AJA:BOOL=OFF
          cmake --build "$sdk_build" --target obs-frontend-api --parallel 2
          cmake --install "$sdk_build" --component Development --prefix "$sdk_prefix"
          echo "OBS_SDK_PREFIX=$sdk_prefix" >> "$GITHUB_ENV"

      - name: Build and package OBS plugin
        shell: bash
        run: |
          set -euo pipefail
          build_dir="build-obs-${{ matrix.family }}-linux"
          cmake -S . -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCOUNTDOWNSTUDIO_BUILD_OBS_PLUGIN=ON \
            -DCOUNTDOWNSTUDIO_OBS_PLUGIN_LAYOUT='${{ matrix.layout }}' \
            -DCMAKE_PREFIX_PATH="$OBS_SDK_PREFIX"
          cmake --build "$build_dir" --parallel 2
          test -f "$build_dir/CountdownStudio.so"
          package_dir="$build_dir/packages"
          mkdir -p "$package_dir"
          cpack --config "$build_dir/CPackConfig.cmake" -B "$package_dir"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.zip' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected one Linux ZIP package, found ${#packages[@]}." >&2
            exit 1
          fi
          python3 -c 'import sys, zipfile; names=zipfile.ZipFile(sys.argv[1]).namelist(); assert any(name.endswith("CountdownStudio.so") for name in names), "CountdownStudio.so missing from package"' "${packages[0]}"
          sha256sum "${packages[0]}" > "$package_dir/SHA256SUMS-${{ matrix.family }}-Linux-x64.txt"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: countdownstudio-${{ matrix.family }}-linux-x64
          path: |
            build-obs-${{ matrix.family }}-linux/packages/*.zip
            build-obs-${{ matrix.family }}-linux/packages/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish Windows release assets
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 10

          cat > release-notes.md <<'EOF'
          ## English

          Windows x64 installers and ZIP packages for OBS Studio 32 and 33, plus Linux x64 ZIP packages built on Ubuntu 24.04 (OBS 32) and Ubuntu 26.04 (OBS 33). SHA-256 checksums are included. Linux packages are compile-verified; loading them inside Linux OBS still needs validation. The NSIS installer is unsigned.

          ## Français

          Installateurs Windows x64 et archives ZIP pour OBS Studio 32 et 33, ainsi que des ZIP Linux x64 compilés sous Ubuntu 24.04 (OBS 32) et Ubuntu 26.04 (OBS 33). Les sommes SHA-256 sont incluses. La compilation Linux est vérifiée, mais le chargement dans OBS sous Linux reste à valider. L’installateur NSIS n’est pas signé.
          EOF

          shopt -s nullglob
          release_files=(release-assets/*.exe release-assets/*.zip release-assets/SHA256SUMS-*.txt)
          test "${#release_files[@]}" -eq 6

          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --target main \
            --title "Countdown Studio ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
